name: Publish Python package

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Python package version to publish (e.g. 2.0.0 or 2.0.0rc1)
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      python_version: ${{ steps.version.outputs.python_version }}
      upstream_version: ${{ steps.version.outputs.upstream_version }}
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          py_ver="${INPUT_VERSION:-${REF_NAME#python-v}}"
          if [[ ! "$py_ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Unsupported PEP 440 Python version: $py_ver" >&2
            exit 1
          fi
          upstream_tag="$(git describe --tags --match 'v2.*' --abbrev=0 2>/dev/null || echo 'v0.0.0')"
          upstream_ver="${upstream_tag#v}"
          echo "python_version=$py_ver" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_ver" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/python-bindings.yml
    with:
      python_version: ${{ needs.prepare.outputs.python_version }}
      upstream_version: ${{ needs.prepare.outputs.upstream_version }}

  publish:
    name: Publish to PyPI
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    if: >-
      github.repository == 'betterleaks/betterleaks' &&
      (startsWith(github.ref, 'refs/tags/python-v') || github.event_name == 'workflow_dispatch')
    environment:
      name: pypi
      url: https://pypi.org/p/betterleaks
    permissions:
      id-token: write
    steps:
      # v7.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      # v1.12.4
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
        with:
          attestations: true
          packages-dir: dist
