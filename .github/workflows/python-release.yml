name: Publish Python package

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (defaults to current ref)
        required: false
        type: string

permissions: {}

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      python_version: ${{ steps.version.outputs.python_version }}
      upstream_version: ${{ steps.version.outputs.upstream_version }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          raw="${tag#v}"
          if [[ ! "$raw" =~ ^2\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          py_ver="${raw/-rc./rc}"
          echo "upstream_version=$raw" >> "$GITHUB_OUTPUT"
          echo "python_version=$py_ver" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/python-bindings.yml
    with:
      python_version: ${{ needs.prepare.outputs.python_version }}
      upstream_version: ${{ needs.prepare.outputs.upstream_version }}

  publish:
    name: Publish to PyPI
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    if: >-
      github.repository == 'betterleaks/betterleaks' &&
      (startsWith(github.ref, 'refs/tags/v2.') || github.event_name == 'workflow_dispatch')
    environment:
      name: pypi
      url: https://pypi.org/p/betterleaks
    permissions:
      id-token: write
    steps:
      # v7.0.2 (download-artifact v7 matches upload-artifact v7)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      # v1.12.4
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
        with:
          attestations: true
          packages-dir: dist
